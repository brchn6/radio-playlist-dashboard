name: Create review issues
on:
  push:
    paths:
      - '.github/review-issues.md'
permissions:
  issues: write
  contents: read
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, subprocess
          text = open('.github/review-issues.md', encoding='utf-8').read()
          blocks = [b.strip() for b in re.split(r'^###\s*$', text, flags=re.M) if b.strip()]
          existing = subprocess.run(['gh','issue','list','--state','all','--limit','500','--json','title'], capture_output=True, text=True, check=True)
          import json as J
          titles = {i['title'] for i in J.loads(existing.stdout)}
          created, skipped, failed = [], [], []
          for b in blocks:
            tm = re.search(r'^##TITLE##\s*(.+)$', b, flags=re.M)
            bm = re.search(r'^##BODY##\s*(.*)$', b, flags=re.S)
            if not tm: continue
            title = tm.group(1).strip()
            body = (bm.group(1).strip() if bm else '')
            if title in titles:
                skipped.append(title); continue
            r = subprocess.run(['gh','issue','create','--repo','brchn6/radio-playlist-dashboard','--title',title,'--body',body], capture_output=True, text=True)
            if r.returncode == 0:
                created.append((title, r.stdout.strip()))
            else:
                failed.append((title, r.stderr.strip()[:200]))
          print('CREATED', len(created))
          for t,u in created: print('URL', u)
          print('SKIPPED', len(skipped))
          for t in skipped: print('SKIP', t)
          print('FAILED', len(failed))
          for t,e in failed: print('FAIL', t, '::', e)
          if failed: raise SystemExit(1)
          PY
